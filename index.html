<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>江戸飛脚</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="panel panel-koku">
          <div class="koku" id="koku">七つ</div>
          <div class="clock" id="clock">—</div>
        </div>
        <div class="panel panel-progress">
          <div class="progress-head">
            <span id="next-landmark">日本橋</span>
            <span id="remaining">残り —</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-marks" id="progress-marks"></div>
          </div>
        </div>
        <div class="panel panel-deadline" id="deadline">
          <div class="deadline-label" id="deadline-label">閉門まで</div>
          <div class="deadline-value" id="deadline-value">—</div>
        </div>
      </div>

      <div class="hud-bottom">
        <div class="gauge">
          <div class="gauge-label">息</div>
          <div class="gauge-track"><div class="gauge-fill" id="stamina-fill"></div></div>
        </div>
        <div class="readout">
          <span id="speed">0.0 km/h</span>
          <span id="grade">±0 ‰</span>
          <span id="elevation">標高 0 m</span>
        </div>
      </div>

      <div id="toast"></div>
      <div id="banner" hidden>
        <div class="banner-head">
          <span class="banner-name" id="banner-name"></span>
          <span class="banner-kana" id="banner-kana"></span>
        </div>
        <p class="banner-note" id="banner-note"></p>
      </div>
    </div>

    <div id="minimap" hidden>
      <canvas id="minimap-canvas"></canvas>
      <div class="minimap-foot">
        <span id="minimap-label">—</span>
        <span class="minimap-credit">地理院タイル</span>
      </div>
    </div>

    <div id="title-screen">
      <div class="title-inner">
        <p class="title-kicker">五街道 · 第一区間</p>
        <h1>江戸飛脚</h1>
        <p class="title-sub">日本橋を発ち、江戸の境を抜ける</p>
        <p class="title-hint">横を向けば海や城が見える。<kbd>Q</kbd><kbd>E</kbd> か右ドラッグ。</p>

        <div class="stage-list" id="stage-list"></div>
        <p class="title-brief" id="title-brief">街道データを読み込んでいます…</p>

        <div class="title-keys">
          <div><kbd>W</kbd>/<kbd>↑</kbd> 走る</div>
          <div><kbd>Shift</kbd> 全力</div>
          <div><kbd>S</kbd>/<kbd>↓</kbd> 緩める</div>
          <div><kbd>A</kbd><kbd>D</kbd> 避ける</div>
          <div><kbd>Space</kbd> 跳ぶ</div>
          <div><kbd>Q</kbd><kbd>E</kbd>／右ドラッグ よそ見</div>
        </div>
        <button id="start-button" disabled>出立</button>
        <p class="title-credit">標高・地図: 国土地理院（標高タイル / 地理院タイル） · 街道線形: 旧街道の現況をデジタイズ</p>
      </div>
    </div>

    <div id="result-screen" hidden>
      <div class="title-inner">
        <h1 id="result-title">着</h1>
        <p class="result-sub" id="result-sub"></p>
        <table class="result-table" id="result-table"></table>
        <div class="result-buttons">
          <button id="retry-button">もう一度走る</button>
          <button id="back-button" class="ghost">街道を選ぶ</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
